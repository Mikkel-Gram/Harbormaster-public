    <script>
        // Cognito has no end_session_endpoint: logout clears the oidc-client session stored by
        // AuthenticationService.js and then redirects to Cognito's /logout endpoint (see CognitoLogoutService).
        window.harbormaster = {
            clearOidcSession: function () {
                for (const storage of [window.sessionStorage, window.localStorage]) {
                    const keys = [];
                    for (let i = 0; i < storage.length; i++) {
                        const key = storage.key(i);
                        if (key && key.startsWith("oidc.")) {
                            keys.push(key);
                        }
                    }
                    keys.forEach(k => storage.removeItem(k));
                }
            }
        };
    </script>
